<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TO-K Admin · Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    :root { font-family: 'Syne', system-ui, sans-serif; color: #1a2018; background: #f5f7f4; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 18px; background: linear-gradient(180deg, #f7faf7 0%, #e8f0e8 100%); }
    .card { width: min(520px,100%); background: #fff; border-radius: 24px; padding: 32px; box-shadow: 0 24px 60px rgba(26,32,24,0.12); border: 1px solid rgba(74,103,65,0.12); }
    h1 { margin: 0 0 8px; font-size: clamp(1.5rem, 2vw, 2.2rem); }
    p { margin: 0 0 24px; color: #6b7a66; line-height: 1.6; }
    .btn { width: 100%; display: inline-flex; justify-content: center; align-items: center; gap: 10px; padding: 14px 18px; border: none; border-radius: 14px; font-weight: 700; cursor: pointer; font-family: inherit; background: #4a6741; color: #fff; transition: transform 0.18s ease, box-shadow 0.18s ease; }
    .btn:hover { transform: translateY(-1px); box-shadow: 0 14px 28px rgba(74,103,65,0.18); }
    .note { margin-top: 18px; font-size: 0.9rem; color: #7a8a78; }
    .error { margin-top: 18px; color: #b03a3a; font-weight: 700; }
    .logo { margin-bottom: 24px; font-family: 'DM Mono', monospace; letter-spacing: 0.16em; color: #4a6741; font-size: 0.78rem; text-transform: uppercase; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">TO-K Admin</div>
    <h1>Iniciar sesión</h1>
    <p>Accede con tu cuenta de Google para generar pedidos y usar el panel administrativo de TO-K.</p>
    <button id="login-btn" class="btn" type="button">Iniciar sesión con Google</button>
    <div id="message" class="note">Si ya has iniciado sesión, serás redirigido automáticamente.</div>
    <div id="error" class="error" style="display:none;"></div>
  </div>
  <script type="module">
    import { auth, signInWithGoogle, onAuthStateChanged } from './tmcore-auth.js';
    const loginBtn = document.getElementById('login-btn');
    const errorEl = document.getElementById('error');
    const messageEl = document.getElementById('message');
    const params = new URLSearchParams(window.location.search);
    const redirectTo = params.get('redirect') || 'tok-admin.html';

    function redirect() {
      window.location.replace(redirectTo);
    }

    onAuthStateChanged(auth, (user) => {
      if (user) redirect();
    });

    loginBtn.addEventListener('click', async () => {
      errorEl.style.display = 'none';
      try {
        await signInWithGoogle();
        redirect();
      } catch (error) {
        errorEl.style.display = 'block';
        errorEl.textContent = error.message || 'No se pudo iniciar sesión. Prueba de nuevo.';
      }
    });
  </script>
</body>
</html>
